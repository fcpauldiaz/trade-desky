<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Cloudflare tunnel exposing local webhook to Trade Desky">
  <rect width="720" height="320" fill="#f9fafb"/>
  <rect x="40" y="60" width="180" height="100" rx="10" fill="#facc15" stroke="#000" stroke-width="3"/>
  <text x="130" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Trade Desky</text>
  <text x="130" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4b5563">cloud (HTTPS)</text>
  <rect x="270" y="60" width="180" height="100" rx="10" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="360" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Tunnel</text>
  <text x="360" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4b5563">Cloudflare / ngrok</text>
  <rect x="500" y="60" width="180" height="100" rx="10" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="590" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#000">127.0.0.1:8787</text>
  <text x="590" y="116" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4b5563">local receiver</text>
  <path d="M220 110 H270" stroke="#000" stroke-width="3"/><path d="M450 110 H500" stroke="#000" stroke-width="3"/>
  <polygon points="268,110 260,106 260,114" fill="#000"/><polygon points="498,110 490,106 490,114" fill="#000"/>
  <rect x="40" y="200" width="640" height="88" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="56" y="228" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Paste into Connections ? Forward URL</text>
  <text x="56" y="250" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb">https://abc-def.trycloudflare.com/webhook</text>
  <text x="56" y="272" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4b5563">Must be HTTPS. Same-machine dev can skip tunnel if receiver is reachable locally.</text>
</svg>
